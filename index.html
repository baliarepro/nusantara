<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nusantara Property</title>
<meta name="description" content="Nusantara Property: listing tanah, rumah, villa dan properti komersial di seluruh Indonesia langsung dari agennya. Hubungi agen via WhatsApp.">
<meta property="og:title" content="Nusantara Property">
<meta property="og:description" content="Listing properti di seluruh Indonesia langsung dari agennya.">
<link rel="preconnect" href="https://mpyspcofrekhnbkxzucr.supabase.co">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky bar, compact hero with search + type chips, card grid of plots; hash views for listing detail & agent page; editor drawer for agents */
:root{
  --bg:#F2F5F1;--surface:#FFFFFF;--sunk:#E8EDE8;--ink:#14201B;--muted:#5A6A63;--line:#D6DED8;
  --jade:#0D5C4D;--jade-soft:#DCEBE5;--on-jade:#FFFFFF;--sun:#B77A0A;
  --z-pariwisata:#E58FB0;--z-permukiman:#E9C43B;--z-pertanian:#5FA463;--z-dagang:#D25B4B;--z-lain:#9AA5A0;
  --wa:#1F8F4E;--danger:#B3372B;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412;--surface:#151F1C;--sunk:#1B2723;--ink:#E6EEEA;--muted:#93A49C;--line:#27352F;
  --jade:#46B597;--jade-soft:#17322A;--on-jade:#06201A;--sun:#E7B04A;--wa:#3DBB73;--danger:#E2685B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412;--surface:#151F1C;--sunk:#1B2723;--ink:#E6EEEA;--muted:#93A49C;--line:#27352F;
  --jade:#46B597;--jade-soft:#17322A;--on-jade:#06201A;--sun:#E7B04A;--wa:#3DBB73;--danger:#E2685B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{flex:none}
.brand{white-space:nowrap}
.nav{align-items:center;flex-wrap:nowrap}
.nav a.btn-line{border:1px solid var(--line)}
@media (max-width:520px){.nav .nav-listing{display:none}.bar .wrap{gap:8px}.brand{font-size:17px}.nav a,.nav .btn{padding:6px 10px}}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a,.btn-ghost{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;border:0;background:none;cursor:pointer}
.nav a:hover,.btn-ghost:hover{color:var(--ink);background:var(--sunk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--jade);color:var(--on-jade)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-line{border-color:var(--line);background:var(--surface)}
.btn-line:hover{border-color:var(--muted)}
.btn-wa{background:var(--wa);color:#fff}
.btn-sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:progress}

/* hero */
.hero{padding-block:44px 22px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1.02;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--jade)}
.hero p{color:var(--muted);max-width:58ch;margin:14px 0 0;font-size:16.5px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--muted)}
.stats b{font-family:var(--f-mono);color:var(--ink);font-weight:500;font-size:15px;margin-right:4px}

/* toolbar */
.tools{display:grid;gap:12px;padding-block:6px 18px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.selects{display:flex;gap:8px;flex-wrap:wrap}
.selects select{padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.65;margin-left:6px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding-bottom:28px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.media{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunk);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.plot{position:absolute;inset:0;display:grid;place-items:center;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.plot .shape{border:2px solid var(--jade);background:color-mix(in srgb,var(--jade) 9%,transparent);display:grid;place-items:center;padding:10px 16px;text-align:center}
.plot .big{white-space:nowrap;font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--jade);line-height:1}
.plot .small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.tag.sewa{background:var(--sun);color:#fff;border-color:transparent}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:18px;font-weight:700;line-height:1.2}
.loc{color:var(--muted);font-size:13.5px}
.specs{display:flex;gap:6px 14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.specs span b{color:var(--ink);font-weight:500}
.zone{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.zone i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--z-lain)}
.price{font-family:var(--f-display);font-weight:700;font-size:20px;margin-top:auto;padding-top:4px}
.price small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.price.ask{font-size:16px;color:var(--muted);font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{flex:none;width:28px;height:28px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden;font-family:var(--f-display)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:64px;height:64px;font-size:22px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:26px 14px;border-top:1px solid var(--line)}
.section-head h2{font-size:26px;font-weight:700}

/* agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:40px}
.agent{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none}
.agent:hover{border-color:var(--muted)}
.agent div{min-width:0}
.agent h3{font-size:17px}
.agent p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* detail */
.back{display:inline-flex;gap:6px;align-items:center;margin-block:22px 14px;color:var(--muted);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;padding-bottom:48px}
@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.gallery{display:grid;gap:8px}
.gallery .main{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--sunk);position:relative;max-width:100%}
.gallery .main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:84px;aspect-ratio:4/3;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.thumbs button[aria-current="true"]{border-color:var(--jade)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-title{font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.08;margin-top:6px}
.d-price{font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:10px}
.facts{width:100%;border-collapse:collapse;margin-top:18px;font-size:14.5px}
.facts th{text-align:left;color:var(--muted);font-weight:500;padding:9px 12px 9px 0;width:40%;vertical-align:top}
.facts td{padding:9px 0;font-family:var(--f-mono);font-size:14px}
.facts tr+tr th,.facts tr+tr td{border-top:1px solid var(--line)}
.desc{white-space:pre-line;max-width:65ch;margin-top:18px}
.side{display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
@media (max-width:860px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone code{font-family:var(--f-mono);font-size:15px;user-select:all;background:var(--sunk);padding:5px 10px;border-radius:6px}
.agent-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-block:8px 22px}
.agent-hero h1{font-size:clamp(26px,4vw,40px);font-weight:800}

/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h2{font-size:20px;margin-right:auto}
.tabs{display:flex;gap:4px;padding:10px 18px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--jade)}
.drawer-body{overflow:auto;padding:18px;display:grid;gap:18px;align-content:start;flex:1}
.form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.field textarea{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pic{position:relative;width:86px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunk)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;line-height:1;font-size:13px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.item div{min-width:0;flex:1}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item small{color:var(--muted)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--danger);flex-wrap:wrap}
.btn-danger{background:var(--danger);color:#fff}
.note{padding:12px 14px;border-radius:8px;background:var(--jade-soft);font-size:14px}
.note.err{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--ink)}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:13.5px}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
/* register */
.reg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:36px;padding-block:8px 56px;align-items:start}
@media (max-width:860px){.reg{grid-template-columns:minmax(0,1fr);gap:24px}}
.reg-intro h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;line-height:1.04}
.reg-intro h1 em{font-style:normal;color:var(--jade)}
.reg-intro>p{color:var(--muted);max-width:46ch;margin:14px 0 0;font-size:16px}
.steps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;border:1.5px solid var(--jade);color:var(--jade);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted);font-size:14px}
.reg .form{padding:22px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;font-weight:500}
.checks input{accent-color:var(--jade);margin:0}
.checks label:has(input:checked){border-color:var(--jade);background:var(--jade-soft)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{margin-top:4px;accent-color:var(--jade)}
.err-text{color:var(--danger);font-size:13px}
.done{display:grid;gap:14px}
.done pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:14px;margin:0;max-height:260px;overflow:auto}
.cta-band{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px;border:1px dashed var(--jade);border-radius:var(--r);margin-bottom:40px}
.cta-band p{margin:0;max-width:52ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* auth & dashboard */
.narrow{max-width:560px}
.flabel{font-size:13px;font-weight:600}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.pill-approved{background:var(--jade-soft);color:var(--jade)}
.pill-pending{background:color-mix(in srgb,var(--sun) 18%,var(--surface));color:var(--ink)}
.pill-rejected{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
.dash{display:grid;gap:16px;padding-block:24px 56px}
.dash-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dash-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin-block:2px 6px}
.dash-tabs{background:none;padding:0;overflow-x:auto}
.dash-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item small{display:block}
.item .thumb{flex:none;width:64px;height:48px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.item-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.item{flex-wrap:wrap}.item-acts{width:100%;justify-content:flex-start}}
.private{border:1px dashed var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;margin:0;min-width:0}
.private legend{font-weight:600;font-size:14px;padding:0 6px;display:flex;gap:8px;align-items:center}
.nav a.btn-primary{color:var(--on-jade);background:var(--jade)}
.dash-tabs button{white-space:nowrap}
a.btn-ghost{text-decoration:none;display:inline-flex;align-items:center}
.form a{color:var(--jade)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="src/app.js"></script>
</body>
</html>
