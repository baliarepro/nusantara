name: Bangun halaman statis (SEO & GEO)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # setiap 3 jam
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bangun halaman listing, kategori, konten, sitemap, llms.txt
        run: node scripts/build.mjs
      - name: Simpan hasil
        run: |
          git config user.name "nusantara-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Perbarui halaman statis, sitemap & llms.txt [otomatis]"
            git push
          fi
